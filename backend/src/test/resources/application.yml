spring:
  task:
    scheduling:
      enabled: false # tests call scheduled methods directly to avoid flakiness

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

storage:
  base-path: build/test-uploads

elasticsearch:
  host: localhost
  port: 9200
  scheme: http

logging:
  level:
    org.hibernate.SQL: WARN
